<!DOCTYPE html>
<html  xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script>
function onManufacturerChange() {
    const select = document.getElementById('manufacturer');
    const newWrapper = document.getElementById('newManufacturerWrapper');
    const newInput = document.getElementById('newManufacturerInput');

    if (select.value === '__add_new__') {
        newWrapper.style.display = 'block';
        newInput.value = '';"D:/0_project/0_busRouteMng/busRouteMng_0/busRouteMng/src/main/resources/templates/apiMng.html"
    } else {
        newWrapper.style.display = 'none';
    }
}

function confirmAddManufacturer() {
    const newInput = document.getElementById('newManufacturerInput');
    const newValue = newInput.value.trim();

    if (!newValue) {
        alert('제조사명을 입력해주세요.');
        return;
    }

    const select = document.getElementById('manufacturer');
    
    // 기존 옵션에 동일한 값이 있는지 확인
    const exists = Array.from(select.options).some(opt => opt.value === newValue);
    if (exists) {
        alert('이미 등록된 제조사입니다.');
        return;
    }

    // 새로운 옵션 추가 후 선택
    const option = new Option(newValue, newValue, true, true);
    select.add(option);
    document.getElementById('newManufacturerWrapper').style.display = 'none';
}

</script>
</head>
<body>
<select id="manufacturer" name="manufacturer" onchange="onManufacturerChange()">
  <option value="">제조사 선택</option>
  <option th:each="item : ${manufacturerList}" th:value="${item}" th:text="${item}"></option>
  <option value="__add_new__">+ 새 제조사 추가</option>
</select>

<!-- 숨겨진 입력창 -->
<div id="newManufacturerWrapper" style="display: none; margin-top: 0.5rem;">
  <input type="text" id="newManufacturerInput" placeholder="새 제조사 입력" />
  <button type="button" onclick="confirmAddManufacturer()">추가</button>
</div>
</body>
</html>
