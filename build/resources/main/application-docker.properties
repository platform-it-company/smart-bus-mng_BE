# =========================
# Tomcat
# =========================
server.tomcat.threads.max=200
server.tomcat.accept-count=100

# =========================
# Hikari
# =========================
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000

# =========================
# Database (docker / ENV)
# =========================
DB_HOST=${DB_HOST:rovidb}
DB_PORT=${DB_PORT:3306}
DB_NAME=${DB_NAME:smartbusmngdb}
DB_USER=${DB_USER:smartbus}
DB_PASSWORD=${DB_PASSWORD}

spring.datasource.url=jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# =========================
# dispatch
# =========================
dispatch.fixed-delay-ms=500
dispatch.batch-size=50
dispatch.stuck-sec=30
dispatch.retry-delay-sec=10
dispatch.max-retry=1

# =========================
# Mqtt
# =========================
mqtt.broker=${MQTT_BROKER:tcp://10.10.10.77:1883}
mqtt.username=${MQTT_USERNAME:smartbusmng-dispatch}
mqtt.password=${MQTT_PASSWORD:plDispatch25!}
mqtt.clientIdPrefix=${MQTT_CLIENT_ID_PREFIX:smartbusmng-dispatch-01}
mqtt.qos=${MQTT_QOS:1}
mqtt.connectTimeoutSec=${MQTT_CONNECT_TIMEOUT_SEC:10}
mqtt.keepAliveSec=${MQTT_KEEP_ALIVE_SEC:30}

# =========================
# File Service
# =========================
file.service.base.url=${FILE_SERVICE_BASE_URL:http://fileservice:8090/api/v2/attachments}