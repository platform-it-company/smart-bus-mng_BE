services:
  smartbusmng:
    build: .
    container_name: smartBusMng_v0_0_1
    restart: unless-stopped

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: docker

    ports:
      - "8082:8081"

    volumes:
      - ./logs:/app/logs

    networks:
      - rovi-net

  smartbusmng-frontend:
    build:
      context: ../smartbusMng-FE
    container_name: smartBusMng_frontend
    restart: unless-stopped

    ports:
      - "5174:80"

    depends_on:
      - smartbusmng

    networks:
      - rovi-net

networks:
  rovi-net:
    external: true
